name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: '0.12.23'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync ruff format --check .
      - run: uv run --no-sync pytest
      - run: uv build --no-sources

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: romm-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify restricted container health and HTTP authentication
        run: |
          docker run -d --name romm-mcp --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /tmp:rw,nosuid,nodev,size=16m \
            -p 127.0.0.1:8080:8080 \
            -e ROMM_URL=http://127.0.0.1:9999 -e ROMM_TOKEN=ci-upstream-token \
            -e MCP_AUTH_TOKEN=ci-mcp-token-at-least-32-characters \
            -e MCP_ALLOWED_HOSTS=localhost,localhost:8080 \
            romm-mcp:ci
          trap 'docker logs romm-mcp; docker rm -f romm-mcp' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://localhost:8080/healthz; then break; fi
            sleep 1
          done
          curl --silent --fail http://localhost:8080/healthz
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -X POST http://localhost:8080/mcp)" = 401
          test "$(docker exec romm-mcp id -u)" = 1000
          docker run --rm --read-only romm-mcp:ci --help
