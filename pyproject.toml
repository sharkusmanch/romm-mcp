[project]
name = "romm-mcp"
version = "0.1.0"
description = "A compact, typed RomM MCP server for stdio and Streamable HTTP"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["mcp==2.3.0", "httpx>=0.28.1,<1", "pydantic>=2.11,<3", "uvicorn>=0.35,<1"]

[project.scripts]
romm-mcp = "romm_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
